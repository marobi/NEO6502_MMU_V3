; ==============================================================
; NEO6502 MMU CONFIG
; ==============================================================
;
; MODEL
;   model.<name> : defines number of contexts
;
; LAYOUT
;   layout.<model>.<layout>.region.<name>
;   - full 64K = 16 pages (0..15)
;   - regions must be contiguous, non-overlapping
;   - sum(pages) == 16
;
; REGION
;   start, pages
;   shared      : true = global, false = per context
;   type        : normal | io
;   trap_write  : sets write trap
;
; SHARED RULE
;   physical identity = (model, region name, page offset)
;   → same name + shared=true = same memory across layouts
;
; PRIVATE RULE
;   shared=false → allocated per context
;
; IO / TRAP
;   type=io OR trap_write=true → set bit7 (0x80)
;
; CONTEXT
;   context.<model>.<id> = layout binding
;
; SYSTEM
;   active_model
;   boot_context
;
; ==============================================================

[system]
config_version        = 2
active_model          = coop_mp
boot_context          = 0

[model.coop_mp]
contexts = 4

; --------------------------------------------------
; KERNEL LAYOUT
; --------------------------------------------------

[layout.coop_mp.kernel.region.k_ram]
start      = 0
pages      = 8
type       = normal
shared     = false

[layout.coop_mp.kernel.region.k_rom]
start      = 8
pages      = 4
type       = normal
shared     = false

[layout.coop_mp.kernel.region.k_io]
start      = 12
pages      = 1
type       = io
shared     = false
trap_write = true

[layout.coop_mp.kernel.region.k_process_ipc]
start      = 13
pages      = 1
type       = normal
shared     = false

[layout.coop_mp.kernel.region.shared_mon]
start      = 14
pages      = 1
type       = normal
shared     = true

[layout.coop_mp.kernel.region.k_bios]
start      = 15
pages      = 1
type       = normal
shared     = false

; --------------------------------------------------
; PROCESS LAYOUT
; --------------------------------------------------

[layout.coop_mp.process.region.p_ram]
start      = 0
pages      = 8
type       = normal
shared     = false

[layout.coop_mp.process.region.p_shared_rom]
start      = 8
pages      = 5
type       = normal
shared     = true

[layout.coop_mp.process.region.shared_ipc]
start      = 13
pages      = 1
type       = normal
shared     = false

[layout.coop_mp.process.region.shared_mon]
start      = 14
pages      = 1
type       = normal
shared     = true

[layout.coop_mp.process.region.p_bios]
start      = 15
pages      = 1
type       = normal
shared     = true

; --------------------------------------------------
; CONTEXT BINDING
; --------------------------------------------------

[context.coop_mp.0]
layout = kernel

[context.coop_mp.1]
layout = process

[context.coop_mp.2]
layout = process

[context.coop_mp.3]
layout = process
