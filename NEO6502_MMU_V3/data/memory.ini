; ==========================================================
; NEO6502_MMU Memory Configuration
; Boot-time MMU configuration
; ==========================================================

[system]
config_version = 1
active_model   = split32



; ==========================================================
; MODEL 1 — 32K Private / 32K Shared
; ----------------------------------------------------------
; Lower 32K private per context
; Upper 32K shared across contexts
; ==========================================================

[model.split32]
contexts = 8

[model.split32.region.private]
start_position = 0        ; pages 0–7  (0000–7FFF)
pages          = 8
type           = normal
shared         = false

[model.split32.region.shared]
start_position = 8        ; pages 8–14 (8000–EFFF)
pages          = 7
type           = normal
shared         = true

[model.split32.region.io]
start_position = 15        ; pages 15 (F000–FFFF)
pages          = 1
type           = io
shared         = true
trap_write     = true


; ==========================================================
; MODEL 2 — CP/M Style Layout
; ----------------------------------------------------------
; Lower 56K private
; Upper 8K shared kernel
; ==========================================================

[model.cpm]
contexts = 4

[model.cpm.region.user]
start_position = 0        ; pages 0–13
pages          = 14
type           = normal
shared         = false

[model.cpm.region.kernel]
start_position = 14       ; pages 14 (E000–EFFF)
pages          = 1
type           = normal
shared         = true

[model.cpm.region.io]
start_position = 15       ; pages 15 (F000–FFFF)
pages          = 1
type           = io
shared         = true
trap_write     = true

; ==========================================================
; MODEL 3 — 8 Fully Independent 64K Contexts
; ----------------------------------------------------------
; No shared memory
; Each context owns 60K + 4K IO
; ==========================================================

[model.full8]
contexts = 8

[model.full8.region.full]
start_position = 0        ; pages 0–14
pages          = 15
type           = normal
shared         = false

[model.full8.region.full]
start_position = 16        ; page 15
pages          = 1
type           = io
shared         = true
trap_write     = true


; ==========================================================
; MODEL 4 — Development Layout With Dedicated I/O Page
; ----------------------------------------------------------
; 48K private
; 4K I/O page (write trapped)
; 12K shared
; ==========================================================

[model.dev_io]
contexts = 4

[model.dev_io.region.private]
start_position = 0        ; pages 0–11 (0000–BFFF)
pages          = 12
type           = normal
shared         = false

[model.dev_io.region.io]
start_position = 12       ; page 12 (C000–CFFF)
pages          = 1
type           = io
shared         = true
trap_write     = true

[model.dev_io.region.shared]
start_position = 13       ; pages 13–14 (D000–EFFF)
pages          = 2
type           = normal
shared         = true

[model.dev_io.region.shared]
start_position = 15       ; pages 15 (F000–EFFF)
pages          = 1
type           = io
shared         = true
trap_write     = true


; ==========================================================
; MODEL 5 — Minimal Single Context (Debug Mode)
; ----------------------------------------------------------
; One context only
; Entire memory shared (no banking)
; Useful for early bring-up and diagnostics
; ==========================================================

[model.single]
contexts = 1

[model.single.region.full]
start_position = 0
pages          = 15
type           = normal
shared         = true

[model.single.region.full]
start_position = 15
pages          = 1
type           = io
shared         = true
trap_write     = true
