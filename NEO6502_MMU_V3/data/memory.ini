[system]
config_version        = 2
active_model          = coop_mp
boot_context          = 0
default_system_layout = kernel
default_user_layout   = process

[model.coop_mp]
contexts = 4

; --------------------------------------------------
; KERNEL LAYOUT
; --------------------------------------------------

[layout.coop_mp.system.kernel.region.k_low_ram]
start      = 0
pages      = 7
type       = normal
shared     = false

[layout.coop_mp.system.kernel.region.shared_ipc]
start      = 7
pages      = 1
type       = normal
shared     = true
trap_write = false

[layout.coop_mp.system.kernel.region.k_kernel_rom]
start      = 8
pages      = 5
type       = normal
shared     = false

[layout.coop_mp.system.kernel.region.k_kernel_io]
start      = 13
pages      = 1
type       = io
shared     = false
trap_write = true

[layout.coop_mp.system.kernel.region.mon]
start      = 14
pages      = 1
type       = normal
shared     = true

[layout.coop_mp.system.kernel.region.k_bios]
start      = 15
pages      = 1
type       = normal
shared     = false

; --------------------------------------------------
; PROCESS LAYOUT
; --------------------------------------------------

[layout.coop_mp.user.process.region.u_low_ram]
start      = 0
pages      = 8
type       = normal
shared     = false

[layout.coop_mp.user.process.region.shared_rom]
start      = 8
pages      = 5
type       = normal
shared     = true

[layout.coop_mp.user.process.region.shared_ipc]
start      = 13
pages      = 1
type       = normal
shared     = true

[layout.coop_mp.user.process.region.mon]
start      = 14
pages      = 1
type       = normal
shared     = true

[layout.coop_mp.user.process.region.c_bios]
start      = 15
pages      = 1
type       = normal
shared     = true

; --------------------------------------------------
; CONTEXT BINDING
; --------------------------------------------------

[context.coop_mp.0]
layout = kernel

[context.coop_mp.1]
layout = process

[context.coop_mp.2]
layout = process

[context.coop_mp.3]
layout = process
