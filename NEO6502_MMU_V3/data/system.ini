; ============================================================
; NEO6502 MMU SYSTEM CONFIGURATION
;
; File location:
;   /system.ini          -> this configuration file
;   /system/*.rom        -> cartridge binary images
;
; Notes:
; - Contexts are pre-defined by MMU at boot.
; - Loading multiple ROMs into the same context is allowed.
; - Load order matters. Later entries overwrite earlier ones
;   if address ranges overlap.
; ============================================================

[system]
version = 1              ; Must match SUPPORTED_VERSION in firmware
default = DEV            ; Configuration selected if no user input


; ------------------------------------------------------------
; CARTRIDGE DEFINITIONS
; ------------------------------------------------------------
; Each cartridge defines a ROM image file.
; The file must exist in /system/ directory.
; The ROM header inside the file determines load address.
; ------------------------------------------------------------

[cartridge bios]
file = bios.rom          ; Core system BIOS

[cartridge monitor]
file = wozmon.rom        ; Woz monitor / debug environment

[cartridge test]
file = test.rom          ; Test application / development image


; ------------------------------------------------------------
; CONFIGURATION DEFINITIONS
; ------------------------------------------------------------
; map = cartridge:context
;
; cartridge  -> must match defined cartridge name
; context    -> MMU context number (0–127)
;
; Multiple entries using the same context are allowed.
; They are loaded sequentially into that context.
; ------------------------------------------------------------


[config DEV]
; Development configuration
; All components layered into context 0
; Order:
;   1. BIOS
;   2. Monitor
;   3. Test program
;
; Final memory image = layered composite

map = bios:0, monitor:0, test:0


[config SAFE]
; Minimal safe configuration
; Only BIOS + Monitor
; Loaded into context 0

map = bios:0, monitor:0
