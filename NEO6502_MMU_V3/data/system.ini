; ============================================================
; NEO6502 SYSTEM CONFIG
;
; Defines cartridge sets and boot configurations.
; Each config is bound to a memory model from memory.ini.
;
; Section types:
;   [system]
;   [cartridge.<name>]
;   [config.<name>]
;   [config.<name>.context.<n>]
;
; Rules:
; - config.<name> must define:
;     memory = <model>
; - each context subsection defines load order
; - load order is sequential (later overwrites earlier)
; ============================================================

[system]
version = 1
default = DEV


; ------------------------------------------------------------
; CARTRIDGES
; ------------------------------------------------------------

[cartridge.bios]
file = bios.rom

[cartridge.wozmon]
file = wozmon.rom

[cartridge.micmon]
file = micmon.rom

[cartridge.test]
file = test.rom

[cartridge.kernel]
file = neox_kernel.rom

[cartridge.syscall]
file = neox_syscall.rom

; ------------------------------------------------------------
; CONFIG: DEV
; simple test environment
; ------------------------------------------------------------

[config.DEV]
memory = default

[config.DEV.context.0]
load = bios, syscall, micmon, kernel


; ------------------------------------------------------------
; CONFIG: MICMON
; monitor + IPC
; ------------------------------------------------------------

[config.MICMON]
memory = default

[config.MICMON.context.0]
load = bios, micmon


; ------------------------------------------------------------
; CONFIG: WOZMON
; minimal monitor
; ------------------------------------------------------------

[config.WOZMON]
memory = default

[config.WOZMON.context.0]
load = bios, wozmon


; ------------------------------------------------------------
; CONFIG: MP (MULTI-PROCESS)
; requires default memory model
; ------------------------------------------------------------

[config.MP]
memory = default

[config.MP.context.0]
load = bios, micmon

[config.MP.context.1]
load = bios, wozmon, micmon

[config.MP.context.2]
load = bios, test, micmon

[config.MP.context.3]
load = bios, micmon


; ------------------------------------------------------------
; CONFIG: SAFE
; fallback safe boot
; ------------------------------------------------------------

[config.SAFE]
memory = default

[config.SAFE.context.0]
load = bios, test
