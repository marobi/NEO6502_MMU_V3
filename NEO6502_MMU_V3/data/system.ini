; ============================================================
; NEO6502 SYSTEM CONFIG
;
; File layout:
;   /system.ini          -> this file
;   /system/*.rom        -> cartridge images
;
; Rules:
; - Each config is split into context subsections
; - Each subsection defines load order for that context
; - Load order is sequential (later overwrites earlier)
; ============================================================

[system]
version = 1
default = MP


; ------------------------------------------------------------
; CARTRIDGES
; ------------------------------------------------------------

[cartridge bios]
file = bios.rom

[cartridge wozmon]
file = wozmon.rom

[cartridge ipc]
file = ipc.rom

[cartridge micmon]
file = micmon.rom

[cartridge test]
file = test.rom


; ------------------------------------------------------------
; CONFIG: DEV
; ------------------------------------------------------------

[config DEV.context 0]
load = bios, wozmon, test


; ------------------------------------------------------------
; CONFIG: MICMON
; ------------------------------------------------------------

[config MICMON.context 0]
load = bios, ipc, micmon


; ------------------------------------------------------------
; CONFIG: WOZMON
; ------------------------------------------------------------

[config WOZMON.context 0]
load = bios, wozmon


; ------------------------------------------------------------
; CONFIG: MP
; ------------------------------------------------------------

[config MP.context 0]
load = bios, ipc, micmon

[config MP.context 1]
load = bios, wozmon, micmon

[config MP.context 2]
load = bios, test, micmon

[config MP.context 3]
load = bios, ipc, micmon


; ------------------------------------------------------------
; CONFIG: SAFE
; ------------------------------------------------------------

[config SAFE.context 0]
load = bios, test
